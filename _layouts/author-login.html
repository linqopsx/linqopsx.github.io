<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  {% assign author_url = 'https://theodore-blog-author.theodore-blog-newsletter.workers.dev' | append: page.author_path %}
  <meta http-equiv="refresh" content="0;url={{ author_url | escape }}">
  <title>作者登录 · Theodore 的博客</title>
  <script src="{{ '/assets/js/dist/theme.min.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/morning.css' | relative_url }}">
  <style>
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:var(--ios-text,#1c1c1e);font:16px/1.75 var(--ios-sans,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif);background:#0b1120 url('{{ "/assets/img/morning/hero-fish.webp" | relative_url }}') center 28%/cover no-repeat fixed}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,20,36,.38),rgba(12,20,36,.58));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    [data-bs-theme="dark"] body::before{background:linear-gradient(180deg,rgba(4,8,18,.58),rgba(0,0,0,.78))}
    main{width:min(440px,100%);padding:34px 32px;border-radius:28px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.75);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:0 20px 48px -18px rgba(0,0,0,.38);text-align:center}
    [data-bs-theme="dark"] main{background:rgba(28,28,30,.82);border-color:rgba(255,255,255,.14)}
    .avatar{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;overflow:hidden;border:2.5px solid rgba(255,255,255,.85)}
    .avatar img{display:block;width:100%;height:100%;object-fit:cover}
    .eyebrow{display:inline-block;margin-bottom:6px;color:var(--ios-blue,#007aff);font-size:12px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:0 0 10px;color:var(--ios-ink,#1c1c1e);font-size:28px;font-weight:750;line-height:1.25;letter-spacing:-.025em}
    p{margin:0 0 14px;color:var(--ios-muted,rgba(60,60,67,.72))}
    a{color:var(--ios-blue,#007aff);text-decoration:none}
    .author-login{display:inline-flex;align-items:center;justify-content:center;width:100%;height:44px;margin:10px 0 18px;border-radius:999px;background:var(--ios-blue,#007aff);color:#fff;font-weight:600}
    .author-login:hover{background:var(--ios-blue-hover,#0066d6)}
    .back{font-size:14px;font-weight:500}
  </style>
</head>
<body class="morning-site">
  <main>
    <div class="avatar"><img src="{{ '/assets/img/avatar.png' | relative_url }}" width="64" height="64" alt="Theodore"></div>
    <span class="eyebrow">Theodore · 写作后台</span>
    <h1>作者登录</h1>
    <p>正在前往作者专用后台。使用作者的 GitHub 账号验证后即可进入。</p>
    <a class="author-login" href="{{ author_url | escape }}">进入作者登录 →</a>
    <p><a class="back" href="{{ '/' | relative_url }}">← 返回博客阅读</a></p>
  </main>
</body>
</html>
