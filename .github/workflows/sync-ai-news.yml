name: "Sync AI News"

on:
  schedule:
    # Every 4 hours (UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-ai-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4
        with:
          path: blog

      - name: Checkout ai-news-bot repo
        uses: actions/checkout@v4
        with:
          repository: linqopsx/ai-bot
          ref: main
          token: ${{ secrets.AI_BOT_READ_TOKEN || github.token }}
          path: ai-bot

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache SQLite database
        uses: actions/cache@v4
        with:
          path: ai-bot/data
          key: ai-news-db-${{ github.run_id }}
          restore-keys: |
            ai-news-db-

      - name: Install ai-news-bot
        working-directory: ai-bot
        run: pip install -e .

      - name: Fetch, summarize, and generate digest
        working-directory: ai-bot
        env:
          DATABASE_URL: "sqlite:///./data/news.db"
          SOURCES_CONFIG_PATH: "./config/sources.yaml"
          LLM_API_KEY: ${{ secrets.AI_NEWS_LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.AI_NEWS_LLM_BASE_URL || 'https://api.huanling.icu/v1' }}
          LLM_MODEL: ${{ vars.AI_NEWS_LLM_MODEL || 'gpt-6.2-sol' }}
          X_API_PROVIDER: "tikhub"
          X_API_BASE_URL: "https://api.tikhub.io"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          TIMEZONE: "Asia/Shanghai"
          ENABLE_SCHEDULER: "false"
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "AI_NEWS_LLM_API_KEY secret is not configured; skipping run."
            exit 0
          fi
          mkdir -p data
          ai-news-bot init-db
          ai-news-bot run
          ai-news-bot digest || true

      - name: Export static JSON and RSS to blog
        run: |
          if [ -f ai-bot/data/news.db ]; then
            python blog/tools/export-ai-news.py ai-bot/data/news.db blog/assets/ai-news
          fi

      - name: Commit, push, and trigger Pages deploy
        working-directory: blog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$(git status --porcelain assets/ai-news)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/ai-news/data.json assets/ai-news/feed.xml
            git commit -m "chore: sync AI news static data"
            git push origin main
            gh workflow run pages-deploy.yml --ref main
          else
            echo "No AI news changes to commit."
          fi
