# GitHub account login editor. Credentials are managed by Pages CMS.
media:
  input: assets/img/uploads
  output: /assets/img/uploads
  categories:
    - image
  rename: safe
content:
  - name: posts
    label: 公开文章
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}-{primary}.md'
      field: create
    view:
      primary: title
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布时间（北京时间）
        type: date
        required: true
        description: 按北京时间填写，使用现在或过去的时间。
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss '+0800'
      - name: description
        label: 摘要
        type: text
      - name: categories
        label: 分类
        type: string
        list:
          max: 2
          collapsible: false
        description: 最多两级，第二项是第一项的子分类。
      - name: tags
        label: 标签
        type: string
        list: true
      - name: image
        label: 封面图片（可选）
        type: image
      - name: comments
        label: 开放留言评论
        type: boolean
        default: true
        description: 开启后，读者可在文章底部使用 GitHub 账号评论；关闭后不显示该文章的评论区。
      - name: pin
        label: 首页置顶
        type: boolean
        default: false
      - name: math
        label: 数学公式
        type: boolean
        default: false
      - name: mermaid
        label: 流程图
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
  - name: updates
    label: 更新公告
    type: collection
    path: _updates
    format: yaml-frontmatter
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}-{primary}.md'
      field: create
    view:
      primary: title
    fields:
      - name: title
        label: 公告标题
        type: string
        required: true
      - name: date
        label: 发布时间（北京时间）
        type: date
        required: true
        description: 请填当前或过去的时间。未来时间不会自动触发博客发布。
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss '+0800'
      - name: description
        label: 邮件更新摘要
        type: text
        required: true
        description: 用两三句话说明这次更新了什么，邮件服务会从订阅源读取此摘要。
      - name: published
        label: 发布公告（进入邮件订阅源）
        type: boolean
        default: false
        description: 先确认相关文章和下载文件已发布成功，再开启并保存。关闭时不展示或推送，但草稿仍在公开仓库，请勿填写私人内容。已发邮件无法撤回；再次通知请新建公告，不要修改旧公告的日期或文件名。
      - name: body
        label: 详细更新说明与相关链接
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
  - name: about
    label: 关于我
    type: file
    path: _tabs/about.md
    format: yaml-frontmatter
    fields:
      - name: icon
        type: string
        hidden: true
        default: fas fa-info-circle
      - name: order
        type: number
        hidden: true
        default: 4
      - name: body
        label: 介绍内容
        type: rich-text
        options:
          format: markdown
          switcher: true
settings:
  content:
    merge: true
