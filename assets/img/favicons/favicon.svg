<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- iOS 26 Squircle Base -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bg)"/>
  <!-- Soft Top Glass Sheen -->
  <rect x="20" y="20" width="472" height="236" rx="108" fill="url(#sheen)"/>
  <!-- Specular Rim Highlight -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <!-- Bold Geometric "T." Monogram -->
  <rect x="116" y="138" width="248" height="56" rx="28" fill="#FFFFFF"/>
  <rect x="212" y="156" width="56" height="222" rx="28" fill="#FFFFFF"/>
  <circle cx="352" cy="346" r="32" fill="#E0F2FE"/>
</svg>
