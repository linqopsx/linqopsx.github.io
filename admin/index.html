<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Theodore 的写作后台</title>
  <link rel="cms-config-url" type="application/json" href="/admin/config.json">
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
    .writing-nav{box-sizing:border-box;position:fixed;inset:0 0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#18212f;color:#fff;z-index:1000;font-size:14px}
    .writing-nav a{color:#e5edff;text-decoration:none}.writing-nav a:hover{text-decoration:underline}.writing-nav div{display:flex;gap:20px}
    #nc-root{position:fixed;inset:48px 0 0;width:100%;height:calc(100% - 48px);overflow:hidden;transform:translateZ(0);isolation:isolate}
    @media(max-width:480px){.writing-nav{padding:0 12px;font-size:12px}.writing-nav div{gap:12px}}
  </style>
</head>
<body>
  <nav class="writing-nav" aria-label="写作导航"><a href="/">Theodore 的博客</a><div><a href="/admin/private/">私人草稿</a><a href="/admin/help/" target="_blank" rel="noopener">帮助</a><a href="/" target="_blank" rel="noopener">查看博客 ↗</a></div></nav>
  <div id="nc-root"></div>
  <noscript>请启用 JavaScript 后使用写作后台。</noscript>
  <script src="/admin/vendor/sveltia-cms.js"></script>
</body>
</html>
